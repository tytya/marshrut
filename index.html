<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршруты</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#141414;--card:#262626;--text:#f2f2f2;--mute:#a0a0a0;--line:#383838;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Inter",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;justify-content:flex-start;margin:6px 0 12px;gap:8px}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:22px 0 4px}
#map{height:340px;border-radius:16px;border:2px solid var(--blue)}
#map.pick{cursor:crosshair;border-color:#f59e0b}
button,input,select,textarea{font:inherit;color:var(--text)}
.chips{display:flex;gap:8px;margin:12px 0 0;overflow-x:auto;padding-bottom:2px}
.chip{border:0;border-radius:20px;padding:8px 16px;background:var(--card);cursor:pointer;white-space:nowrap}
.chips.sub .chip{background:none;border:1px solid #444;padding:6px 14px;font-size:14px}
.chip.on{background:var(--text);color:#101010;font-weight:600;border-color:var(--text)}
.chip.ghost{background:none;border:1px dashed #555;color:var(--mute)}
.share{background:var(--card);border:0;border-radius:20px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.note{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;font-weight:600}
.day{background:var(--card);border-radius:14px;padding:16px;margin:10px 0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.pill{border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;color:#101010}
.right{display:flex;align-items:center;gap:8px}
.km{background:#333;border-radius:20px;padding:4px 12px;font-size:13px;white-space:nowrap}
.ib{background:#333;border:0;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
.ib.on{background:var(--blue)}
.pt{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;padding:10px 0;border-top:1px solid var(--line)}
.main{cursor:pointer}
.n{width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.pt b{display:block}
.pt span{color:var(--mute);font-size:14px}
.acts{display:flex;gap:2px}
.acts button{background:none;border:0;color:var(--mute);padding:4px 6px;cursor:pointer;border-radius:8px}
.acts button:hover{background:#333;color:var(--text)}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tools button{flex:1;background:none;border:1px dashed #555;border-radius:12px;padding:9px;color:var(--mute);cursor:pointer}
.tools button:hover{border-color:var(--blue);color:var(--text)}
.tools .danger:hover{border-color:#ef4444;color:#ef4444}
.fab{position:fixed;right:16px;bottom:16px;background:var(--blue);border:0;border-radius:28px;padding:14px 20px;font-weight:600;box-shadow:0 4px 14px #0008;cursor:pointer}
.mk{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px #0007}
.tag{display:inline-block;background:#333;border-radius:20px;padding:4px 12px;font-size:13px;margin-bottom:8px}
dialog{background:var(--card);color:var(--text);border:0;border-radius:18px;width:min(460px,94vw);padding:20px}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 8px;font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;background:#1a1a1a;border:1px solid #444;border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}
.row>.btn{flex:none;background:var(--blue)}
.res{margin-top:6px;max-height:140px;overflow:auto}
.res div{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.res div:hover{background:#333}
.coord{font-size:13px;color:var(--mute);margin-top:6px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{border:0;border-radius:20px;padding:8px 16px;background:#333;cursor:pointer}
.btn.ok{background:var(--blue)}
button:focus-visible,.main:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.dd{position:relative}
.sq{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);font-size:24px;line-height:1;cursor:pointer;color:var(--text);display:grid;place-items:center;padding:0}
.cp{margin-left:auto;color:var(--mute)}
.cp:hover,.sq:hover,.ttl:hover{background:#333;color:var(--text)}
.ttl{display:flex;align-items:center;gap:8px;background:none;border:0;font-size:26px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:10px}
.ttl svg{color:var(--mute)}
.menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--card);border:1px solid #444;border-radius:14px;padding:6px;z-index:2000;box-shadow:0 8px 24px #000a}
.menu.on{display:block}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.mi:hover{background:#333}
.mi.cur{font-weight:700}
.mi.sub{color:var(--mute)}
.mk.sb{background:#00704A;font-size:15px}
.mk.xm{background:#fff;color:#111;font-size:14px}
.sbn{color:#1fa971}
.n.sb{background:#00704A;color:#fff;font-size:13px}
.n.x{background:none;color:var(--mute);font-size:17px}
.xbox{font-weight:400}
.hint{color:var(--mute);font-size:14px;padding:4px 0}
.acts{align-items:center}
.acts select.asg{width:auto;height:26px;padding:0 12px;border:0;border-radius:20px;background:#333;color:var(--mute);font-size:13px;appearance:none;-webkit-appearance:none;cursor:pointer}
.btn.danger{background:#dc2626}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:10px 18px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3000;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.mrow{display:flex;align-items:center}
.mrow .mi{flex:1;width:auto}
.mx{background:none;border:0;color:var(--mute);padding:6px 8px;cursor:pointer;border-radius:8px}
.mx:hover{background:#333;color:var(--text)}
.pb{border:0;border-radius:14px;padding:4px 10px;margin:6px 4px 0 0;color:#101010;cursor:pointer;font-size:13px}

/* v7: компактные дни, видимые активные теги, режим «посещено» */
.chips .chip{flex:none}
.chips.sub .chip{min-width:38px;text-align:center;padding:6px 12px}
.chips.sub .chip.on{background:var(--text);color:#101010;border-color:var(--text);font-weight:700}
.chips.sub .chip.ghost{border:1px dashed #555;color:var(--mute)}
.head{flex-wrap:nowrap}
.pill{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{flex:none;gap:6px}
.km{font-size:12px;padding:4px 10px}
.tools{flex-wrap:nowrap;gap:6px}
.tools button{min-width:0;padding:9px 4px;font-size:13px;white-space:nowrap}
.tools .danger{flex:none;padding:9px 14px}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #777;background:none;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px;color:#fff;font-size:14px;font-weight:800;line-height:1}
.cb.on{background:var(--blue);border-color:var(--blue)}
.pt.done b,.pt.done span{opacity:.5}
.pt.done b{text-decoration:line-through}
.pt.done .n{opacity:.5}
.pr{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.pr .pb{margin:0;min-width:34px;padding:6px 0;text-align:center;font-size:14px;font-weight:600}
.pr .pb.ed{margin-left:auto;padding:6px 14px}
.pt{position:relative}
.pt[data-r]{transition:transform .15s}
.pt.dragging{z-index:5;background:#333;border-radius:10px;box-shadow:0 6px 18px #000a;transition:none}
body.dragging{user-select:none;-webkit-user-select:none}
.dh{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1}
.pt .hrs{display:block;font-size:13px}
.km.all{background:#1f6f4a}
.gm-style .gm-style-iw-c,.gm-style .gm-style-iw-d{color:#202124!important}
.mk.hotel{background:#8b5cf6;color:#fff;font-size:15px}
.n.hotel{background:#8b5cf6;color:#fff;font-size:13px}
.gb{background:none;border:1px dashed #555;color:var(--mute);border-radius:12px;padding:3px 10px;font-size:12px;margin-top:4px;cursor:pointer}
.gh{font-size:13px;color:var(--mute);margin-top:4px}
.gh summary{cursor:pointer}
.gh div{padding-left:18px}
.gm-style .gm-style-iw-c{color:#202124}
.pp-t{font-weight:700;font-size:15px;line-height:1.25;color:#111!important}
.pp-d{font-size:13px;margin-top:3px;color:#5f6368!important}
.ph{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:10px;background:#eef1f4;font-size:12px;font-weight:600;color:#202124!important}
.gmrow{margin-top:6px;font-size:13px;color:var(--mute)}
.gmb{display:inline-block;padding:7px 14px;border-radius:14px;background:#2a2a2a;color:var(--text);text-decoration:none;font-size:13px;margin:6px 6px 0 0;border:1px solid #444}
.gmrow span{margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--dc);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;min-width:0;max-width:100%}
.pill .dn{flex:none}
.pill .sep{flex:none;width:1px;height:16px;background:#fff;margin-left:6px}
.pill .tl{display:inline-flex;align-items:center;gap:6px;min-width:0;color:#fff;font-style:italic;text-decoration:underline;text-underline-offset:3px}
.pill .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{flex:none}
.chips.sub .chip[style*="--dc"]{background:var(--dc);color:#fff;border:2px solid transparent;font-weight:600}
.chips.sub .chip.on[style*="--dc"]{background:var(--dc);color:#fff;border-color:#fff}
.note.nt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hn{color:#a78bfa}
.pt .main span{display:block}
.pt .hrs{margin-top:2px}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.ib .ic,.mx .ic,.acts button .ic,.tools .ic{width:17px;height:17px;vertical-align:middle}
.hrs .ic,.ph .ic,.gb .ic,#fGh .ic{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.mk .ic,.n .ic{width:15px;height:15px;vertical-align:middle}
.mk.sb,.n.sb{background:none;padding:0}
.mk.sb .ic,.n.sb .ic{width:100%;height:100%}
.pill .dn{font-weight:500}
.pill .ic{width:14px;height:14px}
.pt b{font-weight:600}
.gm-style .gm-style-iw-c{padding:12px 14px!important;max-width:280px!important}
.gm-style .gm-style-iw-chr{position:absolute;top:0;right:0;height:auto}
.gm-style .gm-ui-hover-effect{width:26px!important;height:26px!important}
.gm-style .gm-ui-hover-effect>span{width:16px!important;height:16px!important;margin:5px!important}
.pp-t{font-weight:600!important;padding-right:20px}
.head{margin-bottom:16px}
.pill .tt{font-weight:400}
.pt b{font-weight:500;margin-bottom:4px}
.pt .main .hrs{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 10px;border-radius:10px;background:#333;color:#e6e6e6;font-size:12px;font-weight:600}
.pt .main .hop{display:block;margin-top:8px;font-size:13px;color:var(--mute)}
.pt .main > span:not(.hrs):not(.hop){margin-top:2px}
.ib .ic,.mx .ic{width:14px;height:14px}
.acts button .ic{width:15px;height:15px}
.chips.sub .chip[style*="--dc"],.chips.sub .chip.on[style*="--dc"]{font-weight:500}
.pr .pb{color:#fff}
.pr .pb.ed{color:#101010}
.pr .pb .ic{width:14px;height:14px}
.n.x{background:#fff}
.n.x .ic,.mk.xm .ic{color:#f5c518}
.n.hotel .ic,.mk.hotel .ic{color:#fff}
.ro #fab,.ro .ib,.ro .mx,.ro .acts,.ro .tools,.ro .gb,.ro .chip.ghost,.ro .fx,.ro [data-a^="new"],.ro [data-a^="ren"],.ro [data-a^="del"]{display:none!important}
.loading #list,.loading #map,.loading #dy{visibility:hidden}
.ro #share{display:none!important}
#foot div{margin-top:6px}
.day .head .pill{order:1}
.day .head .right{order:2;margin-left:auto}
.day .head .ib{order:3}
@media (max-width:520px){
  .day .head{flex-wrap:wrap;row-gap:10px;align-items:center}
  .day .head .pill{flex:0 1 auto;max-width:calc(100% - 52px);border-radius:16px}
  .day .head .pill .tl,.day .head .pill .tt{white-space:normal;overflow:visible;text-overflow:clip;min-width:0}
  .day .head .ib{order:2;margin-left:auto}
  .day .head .right{order:3;flex:1 1 100%;margin-left:0}
}
.pt.opt b{color:rgba(255,255,255,.5)!important}
.dnote{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:#333;border:1px solid #444;border-radius:10px;padding:6px 10px;margin:4px 0 10px;font-size:13px;line-height:1.35;color:#e4e4e4}
.dnote span{white-space:pre-wrap;min-width:0}
.dnote .mx{padding:0 2px;flex:none}
</style>
</head>
